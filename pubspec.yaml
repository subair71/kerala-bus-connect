name: kerala_bus_connect
description: FindMyBus with feature-based Clean Architecture and Riverpod.
publish_to: none
version: 2.0.0+2
environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'
dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  hooks_riverpod: ^3.4.3
  flutter_hooks: ^0.21.3+1
  equatable: ^2.0.5
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.3
flutter:
  uses-material-design: true
  assets:
    - assets/images/sponsor-hotel.jpg
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans[wght].ttf
