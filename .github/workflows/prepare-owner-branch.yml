name: Prepare owner dashboard branch
on:
  push:
    branches: [feature/owner-trip-dashboard]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/owner-trip-dashboard
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format source and record resolved dependencies
        run: |
          dart format lib test
          rm .github/workflows/prepare-owner-branch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test pubspec.lock .github/workflows/prepare-owner-branch.yml
          git commit -m "Format owner dashboard and lock test dependencies"
          git push origin HEAD:feature/owner-trip-dashboard
      - run: python3 tool/check_architecture.py
      - run: flutter analyze
      - run: flutter test --reporter expanded
