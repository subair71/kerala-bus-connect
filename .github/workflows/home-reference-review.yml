name: Home reference review
on:
  push:
    branches: [feature/reference-home-screen]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format source
        run: |
          dart format lib/features/passenger/presentation/pages/passenger_page.dart lib/features/passenger/presentation/widgets/search_panel.dart lib/features/timetables/presentation/widgets/service_card.dart lib/app/app_shell.dart tool/capture_screenshots.dart test/redesign_layout_test.dart lib/core/theme/home_theme.dart lib/features/passenger/presentation/widgets/transit_advisory.dart lib/features/passenger/domain/entities/home_service_details.dart lib/features/passenger/data/fixtures/home_service_samples.dart lib/features/passenger/presentation/providers/home_service_providers.dart lib/features/timetables/presentation/widgets/stop_timings_sheet.dart lib/features/timetables/presentation/widgets/compact_service_card.dart test/home_reference_test.dart
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in ["lib/features/passenger/presentation/pages/passenger_page.dart","lib/features/passenger/presentation/widgets/search_panel.dart","lib/features/timetables/presentation/widgets/service_card.dart","lib/app/app_shell.dart","tool/capture_screenshots.dart","test/redesign_layout_test.dart","lib/core/theme/home_theme.dart","lib/features/passenger/presentation/widgets/transit_advisory.dart","lib/features/passenger/domain/entities/home_service_details.dart","lib/features/passenger/data/fixtures/home_service_samples.dart","lib/features/passenger/presentation/providers/home_service_providers.dart","lib/features/timetables/presentation/widgets/stop_timings_sheet.dart","lib/features/timetables/presentation/widgets/compact_service_card.dart","test/home_reference_test.dart"]:
              print('FORMATTED_SOURCE ' + json.dumps({'path': path, 'content': Path(path).read_text()}))
          PY
      - run: python3 tool/check_architecture.py
      - run: flutter analyze
      - run: timeout 180s flutter test --reporter expanded --timeout 60s
      - name: Capture layouts
        if: always()
        run: flutter test tool/capture_screenshots.dart --update-goldens --reporter expanded
      - name: Review images
        if: always()
        run: |
          python3 - <<'PY'
          import base64, json
          from pathlib import Path
          for path in Path('tool/screenshots').glob('*.png'):
              print('REVIEW_IMAGE ' + json.dumps({'name': path.name, 'data': base64.b64encode(path.read_bytes()).decode()}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-reference-screenshots
          path: tool/screenshots/*.png
          retention-days: 14
