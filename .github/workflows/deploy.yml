name: Deploy Flutter Web to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build release web
        env:
          PLATFORM_ENABLED: ${{ vars.PLATFORM_ENABLED }}
          GOOGLE_PLACES_ENABLED: ${{ vars.GOOGLE_PLACES_ENABLED }}
          FIREBASE_APP_CHECK_WEB_SITE_KEY: ${{ vars.FIREBASE_APP_CHECK_WEB_SITE_KEY }}
        run: >-
          flutter build web --release --base-href /kerala-bus-connect/
          --dart-define=PLATFORM_ENABLED=${PLATFORM_ENABLED:-false}
          --dart-define=GOOGLE_PLACES_ENABLED=${GOOGLE_PLACES_ENABLED:-false}
          --dart-define=FIREBASE_APP_CHECK_WEB_SITE_KEY=${FIREBASE_APP_CHECK_WEB_SITE_KEY}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployed desktop and mobile startup
        env:
          SMOKE_BASE_URL: https://subair71.github.io/kerala-bus-connect/
        run: |
          npm install --prefix "$RUNNER_TEMP/startup-browser" --no-audit --no-fund playwright
          "$RUNNER_TEMP/startup-browser/node_modules/.bin/playwright" install --with-deps chromium webkit
          NODE_PATH="$RUNNER_TEMP/startup-browser/node_modules" node tool/web_smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-browser-screenshots
          path: browser-screenshots
          retention-days: 14
