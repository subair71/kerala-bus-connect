name: Search field review
on:
  push:
    branches: [feature/search-field-swap]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format source
        run: |
          dart format lib/features/passenger/presentation/widgets/search_panel.dart
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = 'lib/features/passenger/presentation/widgets/search_panel.dart'
          print('FORMATTED_SOURCE ' + json.dumps({'path': path, 'content': Path(path).read_text()}))
          PY
      - run: python3 tool/check_architecture.py
      - run: flutter analyze
      - run: timeout 180s flutter test --reporter expanded --timeout 60s
      - name: Capture layouts
        run: flutter test tool/capture_screenshots.dart --update-goldens --reporter expanded
      - name: Review images
        run: |
          python3 - <<'PY'
          import base64, json
          from pathlib import Path
          for name in ['mobile-home.png', 'narrow-home.png', 'desktop-home.png']:
              path = Path('tool/screenshots') / name
              print('REVIEW_IMAGE ' + json.dumps({'name': name, 'data': base64.b64encode(path.read_bytes()).decode()}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: search-field-screenshots
          path: tool/screenshots/*.png
          retention-days: 14
