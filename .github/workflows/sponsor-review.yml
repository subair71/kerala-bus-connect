name: Sponsor banner review
on:
  push:
    branches: [feature/sponsor-banner-design]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        run: |
          dart format lib/features/sponsors/presentation/widgets/sponsored_carousel.dart lib/features/sponsors/presentation/providers/sponsor_providers.dart test/sponsors_test.dart tool/capture_screenshots.dart
          python3 - <<'PY'
          import json
          from pathlib import Path
          for p in ["lib/features/sponsors/presentation/widgets/sponsored_carousel.dart","lib/features/sponsors/presentation/providers/sponsor_providers.dart","test/sponsors_test.dart","tool/capture_screenshots.dart"]:
              print("FORMATTED_SOURCE " + json.dumps({"path": p, "content": Path(p).read_text()}))
          PY
      - run: python3 tool/check_architecture.py
      - run: flutter analyze
      - run: timeout 180s flutter test --reporter expanded --timeout 60s
      - name: Capture layouts
        if: always()
        run: flutter test tool/capture_screenshots.dart --update-goldens --reporter expanded
      - name: Review images
        if: always()
        run: |
          python3 - <<'PY'
          import json, base64
          from pathlib import Path
          for name in ["sponsor-banner-320", "sponsor-banner-390", "sponsor-banner-760", "mobile-home", "desktop-home", "mobile-sponsor-large-text"]:
              p = Path("tool/screenshots") / (name + ".png")
              if p.exists():
                  print("REVIEW_IMAGE " + json.dumps({"name": p.name, "data": base64.b64encode(p.read_bytes()).decode()}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sponsor-banner-review
          path: tool/screenshots
          retention-days: 14
