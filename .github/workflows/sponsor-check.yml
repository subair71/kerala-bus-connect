name: Prepare sponsor fix
on:
  push:
    branches: [fix/sponsor-carousel]
permissions:
  contents: read
concurrency:
  group: prepare-sponsor
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format changed files
        run: |
          dart format lib/features/sponsors/presentation/widgets/sponsored_carousel.dart lib/features/sponsors/presentation/providers/sponsor_providers.dart test/support/fakes.dart test/redesign_layout_test.dart tool/capture_screenshots.dart test/widgets_test.dart test/sponsors_test.dart
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in ["lib/features/sponsors/presentation/widgets/sponsored_carousel.dart","lib/features/sponsors/presentation/providers/sponsor_providers.dart","test/support/fakes.dart","test/redesign_layout_test.dart","tool/capture_screenshots.dart","test/widgets_test.dart","test/sponsors_test.dart"]:
              print('FORMATTED_SOURCE ' + json.dumps({'path': path, 'content': Path(path).read_text()}))
          PY
      - run: python3 tool/check_architecture.py
      - run: flutter analyze
      - run: timeout 180s flutter test --reporter expanded --timeout 60s
