name: Validate Flutter
on:
  pull_request:
  push:
    branches: [main, feature/riverpod-clean-architecture, feature/stitch-redesign]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Enforce architecture and state management
        run: python3 tool/check_architecture.py
      - name: Check formatting
        run: |
          dart format lib test tool/capture_screenshots.dart
          python3 tool/ci_format_export.py
      - name: Analyze
        run: flutter analyze
      - name: Tests
        run: timeout 180s flutter test --reporter expanded --timeout 60s
      - name: Capture desktop and mobile layouts
        run: flutter test tool/capture_screenshots.dart --update-goldens --reporter expanded
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stitch-screenshots
          path: tool/screenshots
          retention-days: 14
      - name: Release web build
        run: flutter build web --release --base-href /kerala-bus-connect/
      - name: Browser smoke test
        timeout-minutes: 9
        run: |
          npm install --prefix "$RUNNER_TEMP/stitch-browser" --no-audit --no-fund playwright
          "$RUNNER_TEMP/stitch-browser/node_modules/.bin/playwright" install --with-deps chromium webkit
          NODE_PATH="$RUNNER_TEMP/stitch-browser/node_modules" node tool/web_smoke.cjs
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stitch-browser-screenshots
          path: browser-screenshots
          retention-days: 14
      - name: Verify formatting and dependency lock are committed
        run: git diff --exit-code -- lib test tool/capture_screenshots.dart pubspec.lock
      - name: Save review build
        uses: actions/upload-artifact@v4
        with:
          name: stitch-web
          path: build/web
          retention-days: 14
