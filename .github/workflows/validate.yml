name: Validate Flutter
on:
  pull_request:
  push:
    branches: [main, 'perf/**']
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format changed sources and capture dependency lock
        run: |
          dart format lib/domain/services/service_search_index.dart lib/presentation/blocs/passenger/published_services_cubit.dart lib/presentation/widgets/debounced_builder.dart lib/presentation/widgets/query_stream_builder.dart lib/main.dart lib/data/datasources/transit_remote_data_source.dart lib/presentation/screens/passenger_search_screen.dart lib/presentation/screens/routes_directory_screen.dart lib/presentation/screens/owner_dashboard_screen.dart test/performance_regression_test.dart
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in ["lib/domain/services/service_search_index.dart","lib/presentation/blocs/passenger/published_services_cubit.dart","lib/presentation/widgets/debounced_builder.dart","lib/presentation/widgets/query_stream_builder.dart","lib/main.dart","lib/data/datasources/transit_remote_data_source.dart","lib/presentation/screens/passenger_search_screen.dart","lib/presentation/screens/routes_directory_screen.dart","lib/presentation/screens/owner_dashboard_screen.dart","test/performance_regression_test.dart","pubspec.lock"]:
              print("VALIDATED_FILE:" + json.dumps({"path": path, "content": Path(path).read_text()}))
          PY
      - name: Analyze
        run: flutter analyze
      - run: timeout 120s flutter test --reporter expanded --timeout 60s
      - run: flutter build web --release --base-href /kerala-bus-connect/
