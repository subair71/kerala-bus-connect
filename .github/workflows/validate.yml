name: Validate Flutter
on:
  pull_request:
  push:
    branches: [main, feature/riverpod-clean-architecture]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Enforce architecture and state management
        run: python3 tool/check_architecture.py
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Tests
        run: timeout 180s flutter test --reporter expanded --timeout 60s
      - name: Release web build
        run: flutter build web --release --base-href /kerala-bus-connect/
      - name: Save review build
        uses: actions/upload-artifact@v4
        with:
          name: riverpod-web
          path: build/web
          retention-days: 14
