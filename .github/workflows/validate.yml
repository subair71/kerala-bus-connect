name: Validate Flutter
on:
  pull_request:
  push:
    branches: [main, feature/riverpod-clean-architecture, feature/stitch-redesign]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Enforce architecture and state management
        run: python3 tool/check_architecture.py
      - name: Format and capture source
        run: |
          dart format lib test tool/capture_screenshots.dart
          python3 - <<'PY'
          import json
          from pathlib import Path
          paths = list(Path('lib').rglob('*.dart')) + list(Path('test').rglob('*.dart')) + [Path('pubspec.lock'), Path('tool/capture_screenshots.dart')]
          for path in paths:
              print('VALIDATED_FILE:' + json.dumps({'path': str(path), 'content': path.read_text()}))
          PY
      - name: Analyze
        run: flutter analyze
      - name: Tests
        run: timeout 180s flutter test --reporter expanded --timeout 60s
      - name: Capture desktop and mobile layouts
        run: flutter test tool/capture_screenshots.dart --update-goldens --reporter expanded
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stitch-screenshots
          path: tool/screenshots
          retention-days: 14
      - name: Inspect screenshots
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          import base64, json, io
          from pathlib import Path
          from PIL import Image
          for path in Path('tool/screenshots').glob('*.png'):
              picture = Image.open(path).convert('RGB')
              picture.thumbnail((1200, 1800))
              output = io.BytesIO()
              picture.save(output, format='JPEG', quality=70)
              print('SCREENSHOT:' + json.dumps({'path': path.name, 'data': base64.b64encode(output.getvalue()).decode()}))
          PY
      - name: Release web build
        run: flutter build web --release --base-href /kerala-bus-connect/
      - name: Browser smoke test
        timeout-minutes: 6
        run: |
          npm install --prefix "$RUNNER_TEMP/stitch-browser" --no-audit --no-fund playwright
          "$RUNNER_TEMP/stitch-browser/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/stitch-browser/node_modules" node tool/web_smoke.cjs
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stitch-browser-screenshots
          path: browser-screenshots
          retention-days: 14
      - name: Save review build
        uses: actions/upload-artifact@v4
        with:
          name: stitch-web
          path: build/web
          retention-days: 14
