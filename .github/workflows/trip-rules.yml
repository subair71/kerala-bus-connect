name: Validate trip ownership rules
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
        working-directory: tool/firestore-tests
      - run: npm ci --prefix functions
      - run: tool/firestore-tests/node_modules/.bin/firebase --config firebase.test.json emulators:exec --only firestore --project demo-owner-trips "npm --prefix tool/firestore-tests test && node --test functions/platform.integration.test.js && node functions/load-test.js"
